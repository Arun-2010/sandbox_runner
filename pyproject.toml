[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentkit"
version = "0.4.0"
description = "agent-lab: production patterns for LLM agents, one project at a time."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.6,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]
# The Docker backend drives the `docker` CLI, so it needs no Python packages.
sandbox = []
service = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["agentkit*", "services*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "docker: needs a running Docker daemon and the sandbox image (skipped automatically otherwise)",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
